name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and package DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            Package.resolved
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-build-${{ runner.os }}-

      - name: Build .app
        run: make SKIP_SIGN=1 app

      - name: Package .dmg
        run: make SKIP_SIGN=1 dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TextLens ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: build/TextLens.dmg
          generate_release_notes: true
