name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and package DMG
    runs-on: macos-13
    strategy:
      matrix:
        xcode: ["15.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build .app
        run: make SKIP_SIGN=1 app

      - name: Package .dmg
        run: make SKIP_SIGN=1 dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TextLens ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: build/TextLens.dmg
          generate_release_notes: true
