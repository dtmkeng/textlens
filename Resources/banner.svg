<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8d8ea"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="24" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="650" cy="60" r="120" fill="#00d2ff" opacity="0.04"/>
  <circle cx="700" cy="280" r="100" fill="#3a7bd5" opacity="0.04"/>
  <circle cx="120" cy="280" r="80" fill="#00d2ff" opacity="0.03"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>

  <!-- TextLens icon (stylized magnifying glass with text) -->
  <g transform="translate(60, 80)">
    <!-- Magnifying glass handle -->
    <rect x="68" y="108" width="6" height="50" rx="3" fill="#a8d8ea" transform="rotate(-135, 71, 133)"/>
    <!-- Magnifying glass ring -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#00d2ff" stroke-width="6"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <!-- Lens inner -->
    <circle cx="50" cy="50" r="30" fill="none" stroke="#3a7bd5" stroke-width="1" opacity="0.4"/>
    <!-- Text lines inside lens -->
    <line x1="30" y1="42" x2="70" y2="42" stroke="#a8d8ea" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="52" x2="65" y2="52" stroke="#a8d8ea" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="40" y1="62" x2="60" y2="62" stroke="#a8d8ea" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- App name -->
  <text x="170" y="130" font-family=" -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="56" font-weight="700" fill="url(#text-gradient)" letter-spacing="1">
    TextLens
  </text>

  <!-- Tagline -->
  <text x="170" y="175" font-family=" -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18" fill="#8899aa" letter-spacing="0.5">
    OCR text extraction for macOS
  </text>

  <!-- Feature badges -->
  <g transform="translate(170, 210)">
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#00d2ff" opacity="0.15"/>
    <text x="55" y="19" font-family=" -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#00d2ff" text-anchor="middle" font-weight="500">Screen Capture</text>

    <rect x="122" y="0" width="110" height="28" rx="14" fill="#3a7bd5" opacity="0.15"/>
    <text x="177" y="19" font-family=" -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#3a7bd5" text-anchor="middle" font-weight="500">Clipboard OCR</text>

    <rect x="244" y="0" width="110" height="28" rx="14" fill="#a8d8ea" opacity="0.12"/>
    <text x="299" y="19" font-family=" -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#a8d8ea" text-anchor="middle" font-weight="500">100% Offline</text>
  </g>

  <!-- Decorative bottom-right -->
  <g transform="translate(680, 260)" opacity="0.15">
    <rect x="0" y="0" width="80" height="24" rx="6" fill="#00d2ff"/>
    <text x="40" y="17" font-family=" -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="700">⌃⇧X</text>
  </g>
  <g transform="translate(580, 260)" opacity="0.15">
    <rect x="0" y="0" width="80" height="24" rx="6" fill="#3a7bd5"/>
    <text x="40" y="17" font-family=" -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="700">⌘⇧C</text>
  </g>
</svg>
